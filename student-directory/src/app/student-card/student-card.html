<article class="student-card">
  <div class="avatar">{{ initial }}</div>

  <a class="info" [routerLink]="['/student', id]">
    <h2>{{ name }}</h2>

    @if (showDetails) {
      <span class="score-badge" [class]="scoreClass">
        {{ score }} </span>
    }
  </a>

  <button
    class="favorite-button"
    [class.is-favorite]="isFavorite"
    type="button"
    [attr.aria-label]="isFavorite ? 'Unfavourite' : 'Favourite'"
    (click)="toggleFavorite()"
  >
    <span class="button-icon" aria-hidden="true">&#9825;</span>
  </button>
  <button class="delete-button" type="button" aria-label="Delete" (click)="requestDelete()">
    <span class="button-icon" aria-hidden="true">&#128465;&#65038;</span>
  </button>
</article>
