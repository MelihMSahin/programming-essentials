<article class="student-card">
  <div class="avatar">{{ initial }}</div>

  <a class="info" [routerLink]="['/student', id]">
    <h2>{{ name }}</h2>

    @if (showDetails) {
      <span class="score-badge" [class]="scoreClass">
        {{ score }} </span>
    }
  </a>

  <button type="button" (click)="toggleFavorite()">
    {{ isFavorite ? 'Unfavourite' : 'Favourite' }}
  </button>
  <button type="button" (click)="requestEdit()">Edit</button>
  <button type="button" (click)="requestDelete()">Delete</button>
</article>
