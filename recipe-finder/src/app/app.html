<div class="app-shell" [class.dark-theme]="darkMode()">
  <button
    class="theme-toggle"
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    [attr.title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    @if (darkMode()) {
      <span aria-hidden="true">☀</span>
    } @else {
      <span aria-hidden="true">☾</span>
    }
  </button>

  <router-outlet></router-outlet>
</div>
